<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - Vietnam Travel Guide</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#E87461",
            "background-light": "#fcfcfc",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Be Vietnam Pro", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.75rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
        },
      },
    }
  </script>
<style type="text/tailwindcss">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="layout-content-container flex w-full max-w-md flex-col items-center">
<!-- Illustration -->
<div class="mb-6 flex w-24 h-24 items-center justify-center">
<img class="h-full w-full object-contain" data-alt="A simple line-art illustration of a Vietnamese lantern." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrJhKnbTz2EBnoP9-V1w7SNTtsoWFNzt5IC8cg6_5d3iJLfzx9V2iDQhHq1mYBECTli8QhvQIk9hDfi7HcKPoCFdQr2SyYRUa53yheCcqp3zOHaXiNvYniJUgUumUEZRtsANMpnFzdW2-FcuLA2MQ3okNvpoylZ5uF2BiWSG8VjTsuXFgRlzW8uhM5acb8GTZvfeGsFHvpFt0DHoQaNJxeW-vSGBkR1CLcAL2Ocr2CC7P1lO0oHRDlMgszhMICb_7z50mRWVCOKTQ"/>
</div>
<!-- Headline -->
<h1 class="text-slate-800 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-4">Chào mừng trở lại!</h1>
<!-- Form -->
<div class="mt-4 w-full">
<form action="#" class="flex flex-col gap-y-4" method="POST">
<!-- Email Field -->
<div class="flex flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="email">Email</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary/80 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] text-base font-normal leading-normal transition-shadow duration-200" id="email" name="email" placeholder="your.email@example.com" type="email" value=""/>
</div>
<!-- Password Field -->
<div class="flex flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="password">Mật khẩu</label>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary/80 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-shadow duration-200" id="password" name="password" placeholder="••••••••" type="password" value=""/>
<button aria-label="Toggle password visibility" class="text-slate-500 dark:text-slate-400 flex border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 items-center justify-center px-4 rounded-r-lg border-l-0 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" type="button">
<span class="material-symbols-outlined text-2xl">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/70 dark:focus:ring-offset-background-dark transition-all duration-200">
<span class="truncate">Đăng nhập</span>
</button>
</div>
</form>
</div>
<!-- Secondary Link -->
<div class="mt-8 text-center">
<p class="text-slate-600 dark:text-slate-400">
              Chưa có tài khoản?
              <a class="font-bold text-primary hover:underline" href="#">Tạo tài khoản</a>
</p>
</div>
</div>
</div>
</div>
</div>
</body></html>
