ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [ com.example.ApplicationKt.module ]
    }
}

database {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://localhost:3306/travel_db"
    user = "user"
    password = "password"
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "com.example"
    audience = "users"
    realm = "ktor sample app"
}
